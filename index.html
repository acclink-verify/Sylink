
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0e">
<title>Sylink AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #090a0e;
  --text: #f4f4f7;
  --muted: #858b98;
  --accent: #a58cff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  min-height: 100vh;
}

button, input {
  font-family: inherit;
}

button { cursor: pointer; }

.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  min-height: 72px;
  padding: 0 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ffffff0c;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -1px;
}

.brand svg {
  width: 30px;
  color: #a99aff;
}

.header-label {
  color: #858b98;
  font-size: 11px;
  letter-spacing: 2px;
}

/* MAIN */

main {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 35px 22px 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.intro {
  text-align: center;
}

.intro h1 {
  font-size: clamp(26px, 4vw, 35px);
  font-weight: 500;
  letter-spacing: -1.5px;
}

.intro p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 12px;
}

/* ORB */

.orb-container {
  width: 350px;
  height: 350px;
  max-width: 100%;
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  margin: 8px 0 0;
  pointer-events: none !important;
}

#orb {
  width: 100%;
  height: 100%;
  display: block;
  position: relative;
  z-index: 2;
  overflow: visible;
  pointer-events: none !important;
}

.orb-glow {
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: #9375ff;
  filter: blur(90px);
  opacity: .23;
  pointer-events: none !important;
  z-index: 0;
}

.mesh-line {
  fill: none;
  stroke: url(#meshGradient);
  stroke-width: 1;
  opacity: .66;
}

.mesh-dot {
  fill: url(#meshGradient);
  filter: url(#glow);
}

.mesh-outline {
  fill: none;
  stroke: url(#meshGradient);
  stroke-width: .8;
  opacity: .35;
}

/* CHAT */

.state {
  color: #a6a6b7;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: -5px;
  text-align: center;
}

.chat {
  width: min(620px, 100%);
  margin-top: 30px;
  position: relative !important;
  z-index: 999 !important;
  isolation: isolate;
  pointer-events: auto !important;
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 190px;
  overflow-y: auto;
  margin-bottom: 14px;
  padding: 3px;
}

.message {
  padding: 12px 15px;
  max-width: 85%;
  border-radius: 13px;
  font-size: 13px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-end;
  background: #29243e;
  color: #eeeaff;
}

.message.ai {
  align-self: flex-start;
  background: #15171e;
  border: 1px solid #272a34;
  color: #e1e1e9;
}

/* TEXTBOX */

.input-container {
  position: relative !important;
  isolation: isolate;
  z-index: 1000 !important;
  width: 100%;
  min-height: 60px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 9px 8px 17px;
  border: 1px solid #30323d;
  background: #171921;
  border-radius: 16px;
  transition: border .2s, box-shadow .2s;
  pointer-events: auto !important;
}

.input-container:focus-within {
  border-color: #9480d8;
  box-shadow: 0 0 20px #8f79ff15;
}

#userInput {
  position: relative !important;
  z-index: 1001 !important;
  display: block !important;
  flex: 1 1 auto !important;
  width: 100% !important;
  min-width: 0 !important;
  height: 42px !important;
  padding: 0 5px !important;
  background: transparent !important;
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
  border: none !important;
  outline: none !important;
  opacity: 1 !important;
  visibility: visible !important;
  font-size: 14px !important;
  caret-color: #b8a4ff !important;
  user-select: text !important;
  -webkit-user-select: text !important;
  pointer-events: auto !important;
  touch-action: manipulation;
  appearance: none;
}

#userInput::placeholder {
  color: #888b98 !important;
  -webkit-text-fill-color: #888b98 !important;
  opacity: 1 !important;
}

.action {
  position: relative;
  z-index: 1002;
  flex-shrink: 0;
  width: 39px;
  height: 39px;
  border-radius: 11px;
  border: 1px solid #30323d;
  background: #222530;
  color: #e5e4ef;
  display: grid;
  place-items: center;
  transition: .2s;
  pointer-events: auto;
}

.action:hover {
  background: #373044;
}

.action svg {
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.action.send {
  background: #a394f5;
  color: #101018;
  border: none;
}

.action.recording {
  background: #c45e70;
  color: white;
}

.options {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
}

.options button {
  border: 1px solid #292b35;
  background: transparent;
  color: #9295a2;
  border-radius: 10px;
  padding: 9px;
}

.options button:hover {
  color: white;
  border-color: #8271bd;
}

.options svg {
  width: 17px;
  height: 17px;
  display: block;
}

.hint {
  text-align: center;
  font-size: 10px;
  color: #686c79;
  margin-top: 17px;
}

footer {
  padding: 20px;
  text-align: center;
  font-size: 10px;
  color: #575b66;
  letter-spacing: 1.5px;
}

@media(max-width:600px) {
  header {
    padding: 0 20px;
    min-height: 65px;
  }

  main {
    padding: 35px 18px 20px;
  }

  .orb-container {
    width: 310px;
    height: 310px;
  }

  .chat {
    margin-top: 25px;
  }
}

@media(max-height:750px) {
  main {
    padding-top: 15px;
  }

  .orb-container {
    width: 270px;
    height: 270px;
  }

  .chat {
    margin-top: 15px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M16 3L28 10V22L16 29L4 22V10L16 3Z"
        stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 20L16 10L22 20M12.5 16H19.5"
        stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round"/>
    </svg>
    Sylink
  </div>

  <div class="header-label">PERSONAL AI</div>
</header>

<main>

  <div class="intro">
    <h1>¿En qué puedo ayudarte?</h1>
    <p>Estoy aquí para escucharte.</p>
  </div>

  <div class="orb-container">
    <div class="orb-glow" id="orbGlow"></div>

    <svg id="orb" viewBox="0 0 350 350"
      xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="meshGradient"
          x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8B7CFF">
            <animate attributeName="stop-color"
              values="#8B7CFF;#51D4FF;#B78BFF;#8B7CFF"
              dur="12s" repeatCount="indefinite"/>
          </stop>
          <stop offset="50%" stop-color="#A9A0FF">
            <animate attributeName="stop-color"
              values="#A9A0FF;#8D9FFF;#65E2DA;#A9A0FF"
              dur="12s" repeatCount="indefinite"/>
          </stop>
          <stop offset="100%" stop-color="#56CFFF">
            <animate attributeName="stop-color"
              values="#56CFFF;#B18AFF;#76D8FF;#56CFFF"
              dur="12s" repeatCount="indefinite"/>
          </stop>
        </linearGradient>

        <filter id="glow">
          <feGaussianBlur stdDeviation="1.8"/>
        </filter>

        <clipPath id="circleClip">
          <circle cx="175" cy="175" r="153"/>
        </clipPath>
      </defs>

      <g id="meshGroup" clip-path="url(#circleClip)"></g>

      <circle class="mesh-outline"
        cx="175" cy="175" r="157"/>
    </svg>
  </div>

  <div class="state" id="state">LISTO PARA ESCUCHAR</div>

  <section class="chat">
    <div class="messages" id="messages"></div>

    <div class="input-container">
      <input
        id="userInput"
        type="text"
        placeholder="Escribe un mensaje..."
        autocomplete="off"
        spellcheck="true"
        aria-label="Escribe un mensaje"
      >

      <button class="action" id="micBtn" title="Micrófono" type="button">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round">
          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 11a7 7 0 0014 0M12 18v4m-4 0h8"/>
        </svg>
      </button>

      <button class="action send" id="sendBtn" title="Enviar" type="button">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12H19M12 5L19 12L12 19"/>
        </svg>
      </button>
    </div>

    <div class="options">
      <button id="stopBtn" title="Detener" type="button">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>

      <button id="voiceBtn" title="Voz" type="button">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round">
          <path d="M11 5L6 9H3V15H6L11 19V5Z"/>
          <path d="M15 9a5 5 0 010 6M18 6a9 9 0 010 12"/>
        </svg>
      </button>
    </div>

    <p class="hint">Puedes escribir o hablar con Sylink.</p>
  </section>

</main>

<footer>SYLINK · PERSONAL AI</footer>
</div>

<script>
// ==================================
// MALLA NEURONAL
// ==================================

const svg = document.getElementById("meshGroup");
const NS = "http://www.w3.org/2000/svg";

const nodes = [];
const lineElements = [];
const dotElements = [];

const CENTER = 175;
const RADIUS = 150;
const SPACING = 18;

for (let y = -RADIUS; y <= RADIUS; y += SPACING) {
  for (let x = -RADIUS; x <= RADIUS; x += SPACING) {
    if (Math.hypot(x, y) <= RADIUS) {
      nodes.push({
        x: CENTER + x,
        y: CENTER + y,
        ox: CENTER + x,
        oy: CENTER + y
      });
    }
  }
}

function makeElement(name, attrs) {
  const el = document.createElementNS(NS, name);

  for (const key in attrs) {
    el.setAttribute(key, attrs[key]);
  }

  return el;
}

nodes.forEach((node, i) => {
  nodes.forEach((other, j) => {
    if (j <= i) return;

    const d = Math.hypot(
      node.x - other.x,
      node.y - other.y
    );

    if (d > 0 && d <= SPACING * 1.48) {
      const line = makeElement("line", {
        class: "mesh-line"
      });

      svg.appendChild(line);
      lineElements.push({ line, a: i, b: j });
    }
  });

  const dot = makeElement("circle", {
    class: "mesh-dot",
    r: 1.5
  });

  svg.appendChild(dot);
  dotElements.push(dot);
});

let time = 0;
let sound = 0;
let targetSound = 0;

function animate() {
  time += .018;
  sound += (targetSound - sound) * .12;
  targetSound *= .94;

  const positions = nodes.map(node => {
    const dx = node.ox - CENTER;
    const dy = node.oy - CENTER;
    const dist = Math.hypot(dx, dy);

    const wave =
      Math.sin(dist * .045 - time * 2.1) * 3.5 +
      Math.cos(dx * .035 + time) * 2.5 +
      Math.sin(dy * .04 - time) * 2;

    const factor = 1 + sound * .0008;

    return {
      x: CENTER + dx * factor + (dx / (dist || 1)) * wave,
      y: CENTER + dy * factor + (dy / (dist || 1)) * wave
    };
  });

  lineElements.forEach(item => {
    const a = positions[item.a];
    const b = positions[item.b];

    item.line.setAttribute("x1", a.x);
    item.line.setAttribute("y1", a.y);
    item.line.setAttribute("x2", b.x);
    item.line.setAttribute("y2", b.y);
    item.line.style.opacity = .32 + Math.min(sound / 150, .4);
  });

  dotElements.forEach((dot, i) => {
    dot.setAttribute("cx", positions[i].x);
    dot.setAttribute("cy", positions[i].y);
  });

  document.getElementById("orbGlow").style.opacity =
    .13 + Math.min(sound / 180, .18);

  requestAnimationFrame(animate);
}

animate();

// ==================================
// CHAT
// ==================================

const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const state = document.getElementById("state");

let voiceEnabled = true;

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function reply(text) {
  const t = text.toLowerCase();

  if (t.includes("hola"))
    return "¡Hola! Soy Sylink. ¿Qué te gustaría hacer hoy?";

  if (t.includes("quién eres"))
    return "Soy Sylink, tu asistente virtual. Estoy aquí para ayudarte.";

  if (t.includes("cómo estás"))
    return "¡Estoy funcionando perfectamente! ¿Y tú?";

  if (t.includes("gracias"))
    return "Siempre es un placer ayudarte.";

  return "Te escucho. Cuéntame un poco más para poder ayudarte.";
}

function speak(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "es-ES";
  utterance.rate = 1;
  utterance.pitch = 1;

  const voice = speechSynthesis.getVoices()
    .find(v => v.lang.startsWith("es"));

  if (voice) utterance.voice = voice;

  utterance.onstart = () => {
    state.textContent = "SYLINK ESTÁ HABLANDO";
    targetSound = 40;
  };

  utterance.onend = () => {
    state.textContent = "LISTO PARA ESCUCHAR";
    targetSound = 0;
  };

  speechSynthesis.speak(utterance);
}

function sendMessage() {
  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  addMessage(text, "user");
  input.value = "";

  state.textContent = "PROCESANDO";

  setTimeout(() => {
    const answer = reply(text);
    addMessage(answer, "ai");
    state.textContent = "LISTO PARA ESCUCHAR";
    speak(answer);
    input.focus();
  }, 400);
}

document.getElementById("sendBtn")
  .addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

// ==================================
// MICROFONO
// ==================================

let recognition = null;
let stream = null;
let audioContext = null;
let analyser = null;
let audioLoop = null;

async function startMic() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      "El reconocimiento de voz no está disponible en este navegador. Prueba Chrome o Edge.",
      "ai"
    );
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new AudioContext();
    await audioContext.resume();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;

    audioContext.createMediaStreamSource(stream)
      .connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    function readVolume() {
      if (!analyser) return;

      analyser.getByteFrequencyData(data);
      targetSound = data.reduce((a, b) => a + b, 0) / data.length;

      audioLoop = requestAnimationFrame(readVolume);
    }

    readVolume();

    recognition = new SpeechRecognition();
    recognition.lang = "es-ES";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      state.textContent = "TE ESTOY ESCUCHANDO";
      document.getElementById("micBtn").classList.add("recording");
    };

    recognition.onresult = event => {
      let transcript = "";

      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      input.value = transcript;

      const last = event.results[event.results.length - 1];

      if (last.isFinal) {
        sendMessage();
      }
    };

    recognition.onerror = () => stopMic();
    recognition.onend = () => stopMic();

    recognition.start();

  } catch (error) {
    addMessage(
      "No pude acceder al micrófono. Revisa los permisos del navegador.",
      "ai"
    );
    stopMic();
  }
}

function stopMic() {
  if (recognition) {
    const old = recognition;
    recognition = null;

    try {
      old.stop();
    } catch (e) {}
  }

  if (audioLoop) {
    cancelAnimationFrame(audioLoop);
    audioLoop = null;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  analyser = null;
  targetSound = 0;

  document.getElementById("micBtn")
    .classList.remove("recording");

  state.textContent = "LISTO PARA ESCUCHAR";
}

document.getElementById("micBtn").onclick = () => {
  if (recognition) stopMic();
  else startMic();
};

document.getElementById("stopBtn").onclick = () => {
  stopMic();

  if (window.speechSynthesis) {
    speechSynthesis.cancel();
  }
};

document.getElementById("voiceBtn").onclick = () => {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceBtn").style.opacity =
    voiceEnabled ? "1" : ".4";

  if (!voiceEnabled && window.speechSynthesis) {
    speechSynthesis.cancel();
  }
};

// ==================================
// PROTECCION DEL TEXTBOX
// ==================================

input.addEventListener("input", () => {
  input.style.setProperty("color", "#ffffff", "important");
  input.style.setProperty("-webkit-text-fill-color", "#ffffff", "important");
});

input.addEventListener("click", () => {
  input.focus();
});

</script>
</body>
</html>
