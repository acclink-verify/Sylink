<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sylink</title>
<style>
  :root{
    --bg:#131415; --panel:#18191b; --line:#26282b; --text:#d9d9d6; --mute:#77797c;
    --c:#8fb4d9;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 24px 0}
  .brand{font:500 13px var(--mono);letter-spacing:.14em;color:var(--mute)}
  .link{background:none;border:0;color:var(--mute);font:12px var(--mono);letter-spacing:.08em;cursor:pointer;transition:color .2s}
  .link:hover{color:var(--text)}
  #stage{flex:0 0 46vh;position:relative;transition:flex-basis .8s cubic-bezier(.2,.7,.2,1)}
  body.chatting #stage{flex-basis:20vh}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hint{position:absolute;left:0;right:0;bottom:-18px;text-align:center;color:var(--mute);font-size:13px;pointer-events:none;transition:opacity .5s}
  body.chatting #hint{opacity:0}
  #log{flex:1;overflow-y:auto;padding:8px 24px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .col{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .msg{max-width:100%;word-wrap:break-word;animation:in .4s ease both}
  .msg.user{align-self:flex-end;max-width:85%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
  .msg p+p{margin-top:.7em}
  .msg code.i{font:13px var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .thumbs img{height:64px;border-radius:8px;border:1px solid var(--line);display:block}
  .code{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;background:var(--panel)}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line)}
  .lang{font:11px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
  .copy{background:none;border:1px solid var(--line);color:var(--text);font:11px var(--mono);letter-spacing:.06em;padding:4px 10px;border-radius:7px;cursor:pointer;transition:border-color .2s,color .2s}
  .copy:hover{border-color:var(--mute)}
  .copy.ok{color:var(--c);border-color:var(--c)}
  pre{padding:14px;overflow-x:auto;font:13px/1.6 var(--mono);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .preview{padding:18px;border-top:1px solid var(--line);display:flex;justify-content:center;background:#101112}
  .preview img{max-width:100%;max-height:340px}
  .dots{display:inline-flex;gap:4px;padding:6px 0}
  .dots i{width:4px;height:4px;border-radius:50%;background:var(--mute);animation:b 1.1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  footer{padding:8px 24px calc(18px + env(safe-area-inset-bottom))}
  #chips{max-width:680px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
  #chips div{position:relative}
  #chips img{height:48px;border-radius:8px;border:1px solid var(--line);display:block}
  #chips button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:11px;line-height:1;cursor:pointer}
  .composer{max-width:680px;margin:0 auto;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;transition:border-color .3s}
  .composer:focus-within{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
  textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:15px/1.5 var(--sans);padding:8px 6px;max-height:140px;caret-color:var(--c)}
  textarea::placeholder{color:var(--mute)}
  .ic{width:36px;height:36px;border:0;background:none;color:var(--mute);border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s;flex:none}
  .ic:hover{color:var(--text);background:#202224}
  .ic.on{color:var(--c)}
  .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(420px,90vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{font:500 13px var(--mono);letter-spacing:.1em;margin-bottom:16px;color:var(--mute)}
  dialog label{display:block;font:11px var(--mono);letter-spacing:.08em;color:var(--mute);margin:12px 0 5px}
  dialog input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:13px var(--mono);outline:0}
  dialog input:focus{border-color:var(--mute)}
  dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  dialog .row button{font:12px var(--mono);padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer}
  dialog .row .go{background:var(--text);color:var(--bg);border-color:var(--text)}
  dialog small{display:block;margin-top:14px;color:var(--mute);font-size:12px;line-height:1.5}
  dialog small.err{color:#d98f8f}
</style>
</head>
<body>

<header>
  <span class="brand">SYLINK</span>
  <button class="link" id="open-cfg">api</button>
</header>

<section id="stage">
  <canvas id="orb"></canvas>
  <div id="hint">Habla, escribe o envía una imagen.</div>
</section>

<main id="log"><div class="col" id="col"></div></main>

<footer>
  <div id="chips"></div>
  <div class="composer">
    <button class="ic" id="attach" title="Adjuntar imagen" aria-label="Adjuntar imagen">
      <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Escribe a Sylink"></textarea>
    <button class="ic" id="mic" title="Hablar" aria-label="Hablar">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </button>
    <button class="ic" id="send" title="Enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</footer>

<dialog id="cfg">
  <h2>CONEXIÓN</h2>
  <label>API KEY (OPENAI)</label>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off">
  <label>MODELO</label>
  <input id="model" value="gpt-4o-mini">
  <small id="msg">Se guarda solo en este navegador.</small>
  <div class="row">
    <button id="cfg-cancel">Cerrar</button>
    <button class="go" id="cfg-save">Guardar</button>
  </div>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get: k => { try { return localStorage.getItem(k) } catch { return null } },
    set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }
  };

  /* ---------- ORB ---------- */
  const cv = $('#orb'), ctx = cv.getContext('2d');
  let state = 'idle';
  const N = 150, P = [], E = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    P.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const d = Math.hypot(P[i][0]-P[j][0], P[i][1]-P[j][1], P[i][2]-P[j][2]);
    if (d < .40) E.push([i, j]);
  }
  let W = 0, H = 0, ang = 0, energy = .03, hue = 205, target = 205, nextShift = 8, last = 0;
  function fit() {
    const d = devicePixelRatio || 1, r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  new ResizeObserver(fit).observe(cv);
  const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
  let frame = 0;

  function draw(ts) {
    const t = ts / 1000, dt = Math.min(.05, t - last); last = t;
    const eT = { idle: .03, listening: .10, thinking: .06, speaking: .09 }[state];
    const sp = { idle: .12, listening: .2, thinking: .55, speaking: .25 }[state];
    energy += (eT - energy) * dt * 3;
    ang += sp * dt;
    if (t > nextShift) { target = hue + 50 + Math.random() * 100; nextShift = t + 9 + Math.random() * 7; }
    hue += angDiff(hue, target) * dt * .5; hue = (hue + 360) % 360;

    ctx.clearRect(0, 0, W, H);
    const R = Math.min(W, H) * .36, cx = W / 2, cy = H / 2;
    const ca = Math.cos(ang), sa = Math.sin(ang), cx2 = Math.cos(.35), sx2 = Math.sin(.35);
    const px = [], py = [], pz = [];
    for (let i = 0; i < N; i++) {
      const [x, y, z] = P[i];
      const d = 1 + energy * Math.sin(t * 3 + i * 1.7) + .02 * Math.sin(t * .8 + i);
      const x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
      const y1 = y * cx2 - z1 * sx2, z2 = y * sx2 + z1 * cx2;
      const f = 2.6 / (2.6 - z2);
      px[i] = cx + x1 * d * R * f; py[i] = cy + y1 * d * R * f; pz[i] = z2;
    }
    ctx.lineWidth = 1;
    for (const [i, j] of E) {
      const dep = ((pz[i] + pz[j]) / 2 + 1) / 2;
      ctx.strokeStyle = `hsla(${hue},50%,70%,${.05 + .38 * dep})`;
      ctx.beginPath(); ctx.moveTo(px[i], py[i]); ctx.lineTo(px[j], py[j]); ctx.stroke();
    }
    for (let i = 0; i < N; i++) {
      const dep = (pz[i] + 1) / 2;
      ctx.fillStyle = `hsla(${hue},55%,75%,${.2 + .7 * dep})`;
      ctx.beginPath(); ctx.arc(px[i], py[i], .8 + 1.4 * dep, 0, 6.283); ctx.fill();
    }
    if (++frame % 6 === 0) document.documentElement.style.setProperty('--c', `hsl(${hue},50%,68%)`);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- UI helpers ---------- */
  const col = $('#col'), log = $('#log'), input = $('#input');
  const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
  const LANGS = { js:'JavaScript', javascript:'JavaScript', ts:'TypeScript', typescript:'TypeScript', jsx:'React (JSX)', tsx:'React (TSX)',
    py:'Python', python:'Python', html:'HTML', css:'CSS', json:'JSON', sql:'SQL', bash:'Bash', sh:'Shell', java:'Java', c:'C', cpp:'C++',
    cs:'C#', go:'Go', rust:'Rust', rs:'Rust', php:'PHP', rb:'Ruby', ruby:'Ruby', swift:'Swift', kotlin:'Kotlin', yaml:'YAML', yml:'YAML',
    md:'Markdown', markdown:'Markdown', svg:'SVG (imagen)', xml:'XML', lua:'Lua', dart:'Dart' };
  const langName = l => LANGS[(l || '').toLowerCase()] || (l ? l.toUpperCase() : 'Texto');

  function inline(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/`([^`\n]+)`/g,'<code class="i">$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  }
  let cur;
  function textBlock(txt) {
    txt.split(/\n{2,}/).map(p => p.trim()).filter(Boolean).forEach(p => {
      const el = document.createElement('p');
      el.innerHTML = inline(p).replace(/\n/g, '<br>');
      cur.appendChild(el);
    });
  }
  function codeBlock(lang, code) {
    const box = document.createElement('div'); box.className = 'code';
    const bar = document.createElement('div'); bar.className = 'bar';
    const l = document.createElement('span'); l.className = 'lang'; l.textContent = langName(lang);
    const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copiar';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(code); }
      catch { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      b.textContent = 'Copiado'; b.classList.add('ok');
      setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1500);
    };
    bar.append(l, b);
    const pre = document.createElement('pre'), c = document.createElement('code');
    c.textContent = code; pre.appendChild(c);
    box.append(bar, pre);
    if ((lang || '').toLowerCase() === 'svg') {
      const pv = document.createElement('div'); pv.className = 'preview';
      const im = document.createElement('img');
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(code);
      pv.appendChild(im); box.appendChild(pv);
    }
    cur.appendChild(box);
  }
  function renderAssistant(text) {
    cur = document.createElement('div'); cur.className = 'msg';
    const re = /```([\w+-]*)[^\n]*\n([\s\S]*?)```/g; let i = 0, m;
    while ((m = re.exec(text))) {
      textBlock(text.slice(i, m.index));
      codeBlock(m[1], m[2].replace(/\n$/, ''));
      i = re.lastIndex;
    }
    textBlock(text.slice(i));
    col.appendChild(cur); scroll();
  }
  function renderUser(text, imgs) {
    const el = document.createElement('div'); el.className = 'msg user';
    if (imgs.length) {
      const th = document.createElement('div'); th.className = 'thumbs';
      imgs.forEach(i => { const im = document.createElement('img'); im.src = i.url; th.appendChild(im); });
      el.appendChild(th);
    }
    if (text) { const p = document.createElement('div'); p.textContent = text; el.appendChild(p); }
    col.appendChild(el); scroll();
  }

  /* ---------- Images ---------- */
  let pending = [];
  function drawChips() {
    const c = $('#chips'); c.innerHTML = '';
    pending.forEach((p, idx) => {
      const d = document.createElement('div');
      d.innerHTML = `<img src="${p.url}"><button aria-label="Quitar">×</button>`;
      d.querySelector('button').onclick = () => { pending.splice(idx, 1); drawChips(); };
      c.appendChild(d);
    });
  }
  function loadImage(file) {
    return new Promise(res => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1568 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', .86);
        URL.revokeObjectURL(u);
        res({ url });
      };
      img.src = u;
    });
  }
  $('#attach').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    for (const f of e.target.files) if (f.type.startsWith('image/')) pending.push(await loadImage(f));
    e.target.value = ''; drawChips();
  };

  /* ---------- Voice ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, viaVoice = false;
  if (!SR) $('#mic').style.display = 'none';
  else {
    rec = new SR(); rec.lang = navigator.language || 'es-ES'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = e => {
      let s = ''; for (const r of e.results) s += r[0].transcript;
      input.value = s; grow();
      if (e.results[e.results.length - 1].isFinal) { viaVoice = true; send(); }
    };
    rec.onend = () => { listening = false; $('#mic').classList.remove('on'); if (state === 'listening') state = 'idle'; };
    rec.onerror = () => rec.onend();
  }
  $('#mic').onclick = () => {
    if (!rec) return;
    speechSynthesis.cancel();
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; state = 'listening'; $('#mic').classList.add('on'); } catch {}
  };
  function speak(text) {
    const clean = text.replace(/```[\s\S]*?```/g, ' (código en pantalla) ').replace(/[*`#]/g, '');
    const u = new SpeechSynthesisUtterance(clean); u.lang = rec ? rec.lang : 'es-ES';
    u.onstart = () => state = 'speaking';
    u.onend = u.onerror = () => { if (state === 'speaking') state = 'idle'; };
    speechSynthesis.speak(u);
  }

  /* ---------- Config ---------- */
  const dlg = $('#cfg');
  let KEY = store.get('sy_oai_key') || '';
  let MODEL = store.get('sy_oai_model') || 'gpt-4o-mini';
  $('#key').value = KEY;
  $('#model').value = MODEL;
  $('#open-cfg').onclick = () => dlg.showModal();
  $('#cfg-cancel').onclick = () => dlg.close();
  $('#cfg-save').onclick = async () => {
    const k = $('#key').value.trim(), m = $('#model').value.trim() || 'gpt-4o-mini', msg = $('#msg');
    msg.className = '';
    if (!k) { msg.className = 'err'; msg.textContent = 'Pega tu API key.'; return; }
    msg.textContent = 'Verificando...';
    try {
      const r = await fetch('https://api.openai.com/v1/models', { headers: { authorization: 'Bearer ' + k } });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(r.status === 401 ? 'Error: API key no válida.' : 'Error: ' + (j.error?.message || r.status));
      }
      KEY = k; MODEL = m;
      store.set('sy_oai_key', k); store.set('sy_oai_model', m);
      msg.textContent = 'Se guarda solo en este navegador.';
      dlg.close();
    } catch (e) {
      msg.className = 'err';
      msg.textContent = e.message === 'Failed to fetch' ? 'Error: sin conexión.' : e.message;
    }
  };

  /* ---------- Chat ---------- */
  const SYSTEM = `Eres Sylink, una IA minimalista. Responde en el idioma del usuario, de forma breve y directa, sin emojis.
Cuando entregues código, ponlo SIEMPRE en bloques con la etiqueta del lenguaje correcta (\`\`\`python, \`\`\`html, \`\`\`js...).
Si piden una imagen, ilustración, logo o ícono, genérala como SVG completo y válido (con viewBox) dentro de un bloque \`\`\`svg.
Si el usuario envía una imagen, analízala con atención.`;
  const history = []; let busy = false;

  async function send() {
    if (busy) return;
    const text = input.value.trim();
    if (!text && !pending.length) return;
    const key = KEY;
    if (!key) { dlg.showModal(); viaVoice = false; return; }
    speechSynthesis.cancel(); if (listening) rec.stop();

    document.body.classList.add('chatting');
    const imgs = pending; pending = []; drawChips();
    input.value = ''; grow();
    renderUser(text, imgs);

    const content = [{ type: 'text', text: text || 'Describe esta imagen.' }];
    imgs.forEach(i => content.push({ type: 'image_url', image_url: { url: i.url } }));
    history.push({ role: 'user', content });

    busy = true; state = 'thinking';
    const wait = document.createElement('div'); wait.className = 'msg';
    wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    col.appendChild(wait); scroll();

    try {
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: MODEL,
          messages: [{ role: 'system', content: SYSTEM }, ...history]
        })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.status);
      const out = j.choices[0].message.content || '';
      history.push({ role: 'assistant', content: out });
      wait.remove(); renderAssistant(out);
      state = 'idle';
      if (viaVoice) speak(out);
    } catch (err) {
      history.pop(); wait.remove();
      renderAssistant('No pude conectar: ' + err.message);
      state = 'idle';
    }
    viaVoice = false; busy = false;
  }

  function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
  input.addEventListener('input', grow);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('#send').onclick = send;
})();
</script>
</body>
</html>
